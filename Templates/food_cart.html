<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart</title>
<style>
  :root {
    --page-bg: #fff3dc;
    --card-bg: #ffffff;
    --card-border: #f3e3c3;
    --text: #2b1d10;
    --muted: #8a7560;
    --line: #f0e3c8;
    --chip-border: #f3e3c3;
    --selected-bg: #ffe0b2;
    --selected-border: #f5b84d;
    --selected-text: #7a3b00;
    --cta-bg: #ffb84d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 15px 8px;
    background: var(--page-bg);
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
  }

  .cart {
    max-width: 346px;
    margin: 0 auto;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 16px 14px;
  }

  .cart-title {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .branch {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--muted);
  }

  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 36px;
    font-size: 14px;
  }

  .qty {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .qty button {
    width: 23px;
    height: 23px;
    padding: 0;
    border: 1px solid var(--chip-border);
    border-radius: 6px;
    background: #fff;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .qty span {
    min-width: 11px;
    text-align: center;
    font-size: 13px;
  }

  .price {
    text-align: right;
    font-size: 15px;
  }

  .total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    margin-top: 4px;
    padding-top: 10px;
    font-size: 15px;
    font-weight: 700;
  }

  .label {
    margin: 14px 0 6px;
    font-size: 14px;
    color: var(--muted);
  }
  .label.small { font-size: 13px; margin: 10px 0 7px; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
  }

  .chip {
    padding: 0 15px;
    height: 36px;
    border: 1px solid var(--chip-border);
    border-radius: 999px;
    background: #fff;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
  }
  .chip.selected {
    background: var(--selected-bg);
    border-color: var(--selected-border);
    color: var(--selected-text);
    font-weight: 700;
  }

  .time .chip { height: 36px; padding: 0 15px; }
  .time .chip:disabled {
    cursor: not-allowed;
    color: var(--text);
  }

  .place-order {
    display: block;
    width: 100%;
    height: 42px;
    margin-top: 10px;
    border: 0;
    border-radius: 9px;
    background: var(--cta-bg);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
</style>
</head>
<body>

<section class="cart">
  <h2 class="cart-title"><span>🛒</span> Your cart</h2>
  <p class="branch">Cainta Main Branch</p>

  <div class="item">
    <span class="name">Champorado</span>
    <div class="qty">
      <button type="button">-</button>
      <span>1</span>
      <button type="button">+</button>
    </div>
    <span class="price">₱30</span>
  </div>

  <div class="item">
    <span class="name">Lugaw with Egg</span>
    <div class="qty">
      <button type="button">-</button>
      <span>1</span>
      <button type="button">+</button>
    </div>
    <span class="price">₱42</span>
  </div>

  <div class="total">
    <span>Total</span>
    <span>₱72</span>
  </div>

  <p class="label">Payment method</p>
  <div class="chips" id="payment">
    <button type="button" class="chip selected">Cash</button>
    <button type="button" class="chip">GCash</button>
    <button type="button" class="chip">Maya</button>
  </div>

  <p class="label small">Pickup time (today) · order by 9:30 AM</p>
  <div class="chips time" id="time">
    <button type="button" class="chip" disabled>7:00 AM (passed)</button>
    <button type="button" class="chip" disabled>7:30 AM (passed)</button>
    <button type="button" class="chip" disabled>8:00 AM (passed)</button>
    <button type="button" class="chip" disabled>8:30 AM (passed)</button>
    <button type="button" class="chip selected">9:00 AM</button>
    <button type="button" class="chip">9:30 AM</button>
    <button type="button" class="chip">10:00 AM</button>
  </div>

  <button type="button" class="place-order">Place order</button>
</section>

<script>
  function singleSelect(groupId) {
    const group = document.getElementById(groupId);
    group.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip || chip.disabled) return;
      group.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
    });
  }
  singleSelect('payment');
  singleSelect('time');
</script>
</body>
      </html>
