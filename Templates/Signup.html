<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Kain tayo!!</title>
  <style>
    /* Reset & Fonts */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fff8e8; /* Warm off-white/beige background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Logo / Icon */
    .bento-icon {
      font-size: 50px;
      margin-bottom: 12px;
      line-height: 1;
    }

    /* Headers */
    .title {
      font-size: 28px;
      font-weight: 800;
      color: #221a15;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 15px;
      color: #70655c;
      margin-bottom: 24px;
      text-align: center;
    }

    /* Form Card */
    .card {
      background-color: #ffffff;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    /* Input Groups */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #554d46;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background-color: #fff8e8; /* Soft light cream input background */
      border: 1.5px solid #f2e6d5;
      border-radius: 12px;
      font-size: 15px;
      color: #332d28;
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .form-group input::placeholder {
      color: #9e9389;
    }

    .form-group input:focus {
      border-color: #f7a93b;
      background-color: #ffffff;
    }

    .form-group input.invalid {
      border-color: #e74c3c;
      background-color: #fff5f4;
    }

    .error-message {
      display: none;
      background: #fdecea;
      color: #c0392b;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .error-message.visible {
      display: block;
    }

    /* Button */
    .btn-submit {
      width: 100%;
      padding: 15px;
      background-color: #f7a93b; /* Warm orange button */
      color: #221a15;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 20px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background-color: #e6982a;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      background-color: #edd3a4;
      cursor: not-allowed;
    }

    /* Footer link */
    .footer-text {
      text-align: center;
      font-size: 14px;
      color: #6b6057;
    }

    .footer-text a {
      color: #2243e8; /* Blue link color */
      text-decoration: underline;
      font-weight: 600;
    }

    .footer-text a:hover {
      color: #1a32b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header Icon & Title -->
    <div class="bento-icon">🥘</div>
    <h1 class="title">Create Account</h1>
    <p class="subtitle">Join Kain tayo!! to start pre-ordering</p>

    <!-- Registration Form -->
    <div class="card">
      <form id="signupForm" action="#" method="POST" novalidate>

        <div class="error-message" id="errorMessage"></div>

        <div class="form-group">
          <label for="student-id">Student ID / Employee ID</label>
          <input type="text" id="student-id" placeholder="Enter your Student ID or Employee ID" required>
        </div>

        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" placeholder="e.g. Juan Dela Cruz" required>
        </div>

        <div class="form-group">
          <label for="email">Email/Username</label>
          <input type="text" id="email" placeholder="e.g. juan@school.edu" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password (min. 8 characters)" required>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Re-type your password" required>
        </div>

        <div class="form-group">
          <label for="contact">Contact Number</label>
          <input type="tel" id="contact" placeholder="e.g. 0917 123 4567" required>
        </div>

        <button type="submit" class="btn-submit" id="signupButton">Create Account</button>

      </form>

      <p class="footer-text">
        Already have an account? <a href="#">Log in</a>
      </p>
    </div>
  </div>

  <script>
    const form = document.getElementById("signupForm");
    const studentId = document.getElementById("student-id");
    const fullName = document.getElementById("full-name");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm-password");
    const contact = document.getElementById("contact");
    const errorMessage = document.getElementById("errorMessage");
    const btn = document.getElementById("signupButton");

    // Helper: show error box + red outline on the field
    function showError(field, msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add("visible");
      field.classList.add("invalid");
      field.focus();
    }

    // Clear error styling while typing
    document.querySelectorAll("input").forEach(input => {
      input.addEventListener("input", () => {
        input.classList.remove("invalid");
        errorMessage.classList.remove("visible");
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMessage.classList.remove("visible");

      // 1. Student/Employee ID: any non-empty value accepted
      if (!studentId.value.trim()) {
        return showError(studentId, "Please enter your Student ID or Employee ID");
      }

      // 2. Full name: at least first + last name
      if (fullName.value.trim().split(" ").filter(Boolean).length < 2) {
        return showError(fullName, "Please enter your first and last name");
      }

      // 3. Email format
      if (!/^\S+@\S+\.\S+$/.test(email.value.trim())) {
        return showError(email, "Please enter a valid email address");
      }

      // 4. Password: minimum 8 characters
      if (password.value.length < 8) {
        return showError(password, "Password must be at least 8 characters");
      }

      // 5. Passwords must match
      if (password.value !== confirmPassword.value) {
        return showError(confirmPassword, "Passwords do not match");
      }

      // 6. PH contact number: 09XX XXX XXXX or +63 9XX XXX XXXX
      const digits = contact.value.replace(/\D/g, "");
      if (!/^(09\d{9}|639\d{9})$/.test(digits)) {
        return showError(contact, "Enter a valid PH number, e.g. 0917 123 4567");
      }

      // Loading state
      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: studentId.value.trim(),
            fullName: fullName.value.trim(),
            email: email.value.trim(),
            password: password.value,
            contact: digits
          })
        });

        if (response.ok) {
          window.location.href = "kain-tayo-login.html"; // go to login after signup
        } else {
          const data = await response.json().catch(() => ({}));
          errorMessage.textContent = data.message || "Registration failed. Try again.";
          errorMessage.classList.add("visible");
        }
      } catch (err) {
        errorMessage.textContent = "Can't reach the server. Check your connection.";
        errorMessage.classList.add("visible");
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
