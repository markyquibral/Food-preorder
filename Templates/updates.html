<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kain tayo!! — Order updates</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  body { background: #fdf3df; color: #222; max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 84px; }
  a { text-decoration: none; color: inherit; }

  /* ===== Header ===== */
  .header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center;
    padding: 14px 16px; background: #fdf3df;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand .logo {
    width: 30px; height: 30px; border: 2.5px solid #333; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }

  /* ===== Corner bell ===== */
  .icon-btn {
    position: fixed; top: 12px; right: 12px; z-index: 99;
    background: #fff; border: 1.5px solid #e5dfd0; border-radius: 999px;
    width: 44px; height: 44px; font-size: 21px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s; padding: 0;
  }
  .icon-btn:active { transform: scale(.88); background: #ffdcae; }

  h1 { font-size: 26px; padding: 10px 16px 14px; }

  /* ===== Update card ===== */
  .section { background: #fff; border-radius: 16px; margin: 10px 14px; padding: 18px 16px; }
  .order-head { display: flex; align-items: flex-start; gap: 14px; }
  .order-title { flex: 1; font-size: 17px; font-weight: 800; line-height: 1.3; }
  .receipt-btn {
    border: 1.5px solid #e0d9c8; background: #fff; border-radius: 999px;
    padding: 8px 16px; font-size: 13.5px; cursor: pointer; white-space: nowrap;
    transition: transform .1s, background .1s;
  }
  .receipt-btn:active { transform: scale(.92); background: #fff3e0; }
  .order-when { color: #888; font-size: 13px; margin-top: 4px; text-align: right; white-space: nowrap; }
  .order-items { color: #888; font-size: 14px; margin-top: 10px; }
  .pickup-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 15px; }
  .pickup-row b { font-weight: 800; }

  /* ===== Status tracker ===== */
  .tracker {
    display: flex; justify-content: space-between; margin-top: 16px; padding: 0 6px;
    position: relative;
  }
  .tracker::before {
    content: ""; position: absolute; top: 14px; left: 12%; right: 12%;
    height: 3px; background: #f2e8d5; border-radius: 2px;
  }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; z-index: 1; flex: 1; }
  .dot {
    width: 28px; height: 28px; border-radius: 999px; background: #f5ead2;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .step.done .dot { background: #f2811f; color: #fff; }
  .step-label { font-size: 13px; color: #666; }
  .step.done .step-label { color: #222; font-weight: 700; }

  /* ===== Bottom nav ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 480px;
    display: flex; justify-content: space-around;
    background: #fff; border-top: 1px solid #eee; padding: 10px 0 14px; z-index: 90;
  }
  .nav-item {
    text-align: center; font-size: 12px; color: #777; width: 70px; cursor: pointer;
    padding: 4px 0; border-radius: 12px; transition: transform .1s;
  }
  .nav-item .nav-ico { font-size: 20px; display: block; margin-bottom: 2px; }
  .nav-item:active { transform: scale(.88); }
  .nav-item.active { color: #e8590c; font-weight: 700; background: #ffdcae; }
  .nav-badge {
    position: absolute; top: 0; right: 14px; background: #e8590c; color: #fff;
    font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 7px;
  }
  .nav-wrap { position: relative; }
</style>
</head>
<body>

<!-- ===== Header ===== -->
<div class="header">
  <div class="brand"><span class="logo">🍽️</span> Kain tayo!! <span style="color:#999;font-weight:400">▾</span></div>
  <button class="icon-btn">🔔</button>
</div>

<h1>Order updates</h1>

<!-- ===== Active order card ===== -->
<div class="section">
  <div class="order-head">
    <div style="flex:1">
      <div class="order-title">#1008 · Cainta Main Branch</div>
      <div class="order-items">Champorado, Lugaw with Egg · ₱72</div>
    </div>
    <div>
      <button class="receipt-btn">Receipt</button>
      <div class="order-when">Today, 8:53 AM</div>
    </div>
  </div>

  <div class="pickup-row">🕐 Pickup: <b>9:00 AM</b> · Cainta Main Branch</div>

  <!-- Status tracker -->
  <div class="tracker">
    <div class="step done"><span class="dot">✓</span><span class="step-label">Pending</span></div>
    <div class="step"><span class="dot"></span><span class="step-label">Preparing</span></div>
    <div class="step"><span class="dot"></span><span class="step-label">Ready</span></div>
    <div class="step"><span class="dot"></span><span class="step-label">Completed</span></div>
  </div>
</div>

<!-- ===== Bottom nav ===== -->
<div class="bottom-nav">
  <div class="nav-item"><a href="food_cart.html"><span class="nav-ico">🏠</span>Home</a></div>
  <div class="nav-item"><a href="orders.html"><span class="nav-ico">📋</span>Orders</a></div>
  <div class="nav-item active">
    <div class="nav-wrap"><span class="nav-ico">🔔</span><span class="nav-badge">2</span></div>Updates
  </div>
  <div class="nav-item"><span class="nav-ico">👤</span>Profile</div>
</div>

</body>
                                                   </html>
